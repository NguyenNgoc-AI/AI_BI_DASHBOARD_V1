[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    synthetic_core: Tests for Schema, Rules, EDA Profiling, and Synthetic Generation Core
    synthetic_api: Tests for FastAPI Synthetic Data Endpoints (/api/v1/synthetic)
    backend: Tests for Auth, Ingestion, Dashboard KPIs, Reports, and Chatbot

